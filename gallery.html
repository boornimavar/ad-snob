<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14141b;--panel:#1c1b24;--panel-2:#24232d;--line:#373541;--ink:#f0eee8;--muted:#a5a2b0;--dim:#777482;
  --lime:#d8ff67;--lime-soft:#313a25;--sans:'DM Sans',Arial,sans-serif;--serif:'Playfair Display',Georgia,serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;background:var(--panel)}
.brand{font:600 22px var(--serif);margin:0 8px 4px}
.tagline{color:var(--dim);font-size:12px;margin:0 8px 18px}
.label{font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:14px 8px 6px}
.cats{display:grid;gap:2px}
.cat{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid transparent;
  background:none;color:var(--muted);border-radius:9px;padding:9px 10px;font-size:13px}
.cat:hover{background:var(--panel-2);color:var(--ink)}
.cat[aria-current="true"]{background:var(--lime-soft);border-color:#4b5a32;color:var(--ink)}
.cat .n{font:12px var(--mono);color:var(--dim)}
main{padding:24px 28px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px}
h1{font:500 clamp(24px,3vw,34px)/1.15 var(--serif);margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.toggle input{accent-color:var(--lime);width:16px;height:16px}
.grid{columns:4 220px;column-gap:14px}
.card{display:inline-block;width:100%;margin:0 0 14px;break-inside:avoid;background:var(--panel);border:1px solid #34323e;
  border-radius:12px;overflow:hidden;text-align:left;padding:0}
.card:hover{border-color:#55525f}
.card img{display:block;width:100%;height:auto;background:var(--panel-2);min-height:120px}
.expired{display:grid;place-items:center;height:180px;color:var(--dim);font-size:12px;background:var(--panel-2)}
.meta{padding:10px 12px 12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.score{font:500 12px var(--mono);padding:2px 7px;border-radius:6px;background:var(--panel-2);color:var(--muted)}
.score.hi{background:var(--lime-soft);color:var(--lime)}
.who{font-weight:600;font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seen{font-size:11.5px;color:var(--dim)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;width:min(900px,94vw);max-height:92vh}
dialog::backdrop{background:#000a}
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.detail img{width:100%;height:100%;max-height:88vh;object-fit:contain;background:#000}
.detail .info{padding:20px 22px;overflow:auto;max-height:88vh}
.detail h2{font:500 22px var(--serif);margin:0 0 6px}
.detail p{margin:6px 0;color:var(--muted);font-size:13.5px;white-space:pre-line}
.detail a{color:var(--lime)}
.close{position:absolute;top:10px;right:12px;border:0;background:#000a;border-radius:8px;padding:4px 10px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .cats{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .cat{white-space:nowrap;width:auto;border-color:var(--line)}
  main{padding:18px 16px}
  .grid{columns:2 150px;column-gap:10px}
  .detail{grid-template-columns:1fr}
  .detail img{max-height:50vh}
}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">Creative Lens</div>
    <p class="tagline">Design-led Meta ads collected by the team</p>
    <div class="label">Categories</div>
    <nav class="cats" id="cats"></nav>
  </aside>
  <main>
    <div class="head">
      <div>
        <h1 id="title">All categories</h1>
        <div class="sub" id="sub"></div>
      </div>
      <div class="controls">
        <div class="tabs" role="group" aria-label="Which ads">
          <button id="tab-active" aria-pressed="true">Active</button>
          <button id="tab-archive" aria-pressed="false">Archive</button>
        </div>
        <label class="toggle"><input type="checkbox" id="design-led" checked> Design-led only</label>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<dialog id="dialog"></dialog>

<!-- Online: config.js sets window.CREATIVE_LENS = {supabaseUrl, publishableKey} and the
     page reads the team library from Supabase. Without it, it reads the local service. -->
<script src="config.js"></script>
<script>
const ARCHIVE_DAYS = 14;
const DESIGN_LED_MIN = 0.5;
const SUPABASE = window.CREATIVE_LENS && window.CREATIVE_LENS.supabaseUrl ? window.CREATIVE_LENS : null;
const state = {category: "", country: "", archived: false, designLed: true, categories: []};

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.category = p.get("category") || "";
  state.country = p.get("country") || "";
  state.archived = p.get("view") === "archive";
  state.designLed = p.get("all") !== "1";
}

function writeHash() {
  const p = new URLSearchParams();
  if (state.category) p.set("category", state.category);
  if (state.country) p.set("country", state.country);
  if (state.archived) p.set("view", "archive");
  if (!state.designLed) p.set("all", "1");
  history.replaceState(null, "", "#" + p.toString());
}

function shortDate(text) {
  const d = new Date(text.includes("T") ? text : text.replace(" ", "T") + "Z");
  return d.toLocaleDateString(undefined, {day: "numeric", month: "short"});
}

function picture(ad, onError) {
  const src = ad.thumbnail_url || ad.image_url;
  const img = el("img", {src, alt: ad.brand || "Ad", loading: "lazy"});
  img.addEventListener("error", () => img.replaceWith(el("div", {class: "expired"}, "Picture no longer available")), {once: true});
  return img;
}

function renderCategories() {
  const nav = document.getElementById("cats");
  nav.replaceChildren();
  const total = state.categories.reduce((n, c) => n + (state.archived ? c.archived : c.active), 0);
  const all = el("button", {class: "cat", "aria-current": String(!state.category), onclick: () => choose("", "")},
    el("span", {}, "All categories"), el("span", {class: "n"}, String(total)));
  nav.append(all);
  for (const c of state.categories) {
    const current = c.category.toLowerCase() === state.category.toLowerCase() && c.country === state.country;
    nav.append(el("button", {class: "cat", "aria-current": String(current), onclick: () => choose(c.category, c.country)},
      el("span", {}, `${c.category} · ${c.country}`),
      el("span", {class: "n"}, String(state.archived ? c.archived : c.active))));
  }
}

function choose(category, country) {
  state.category = category; state.country = country;
  refresh();
}

function renderAds(ads) {
  const grid = document.getElementById("grid");
  grid.replaceChildren();
  document.getElementById("title").textContent = state.category ? `${state.category} · ${state.country}` : "All categories";
  const brands = new Set(ads.map(a => a.brand)).size;
  document.getElementById("sub").textContent = `${ads.length} ${state.archived ? "archived" : "active"} ads from ${brands} brands` +
    (state.archived ? ` · not seen in any search for ${ARCHIVE_DAYS}+ days` : " · best first");
  if (!ads.length) {
    grid.append(el("div", {class: "empty"}, state.archived
      ? "Nothing in the archive here yet."
      : "No ads here yet. Run a search with the Collector app and they'll appear here."));
    return;
  }
  for (const ad of ads) {
    const score = ad.rank_score == null ? "–" : ad.rank_score.toFixed(2);
    grid.append(el("button", {class: "card", onclick: () => showDetail(ad)},
      picture(ad),
      el("div", {class: "meta"},
        el("div", {class: "row"},
          el("span", {class: "score" + (ad.rank_score >= 0.5 ? " hi" : "")}, score),
          el("span", {class: "seen"}, `last seen ${shortDate(ad.last_seen_at)}`)),
        el("div", {class: "who"}, ad.brand || "Unknown brand"))));
  }
}

function showDetail(ad) {
  const d = ad.details || {};
  const dialog = document.getElementById("dialog");
  const lines = [d.title, d.body, d.cta && `Button: ${d.cta}`].filter(Boolean);
  dialog.replaceChildren(
    el("button", {class: "close", onclick: () => dialog.close(), "aria-label": "Close"}, "✕"),
    el("div", {class: "detail"},
      picture(ad),
      el("div", {class: "info"},
        el("h2", {}, ad.brand || "Unknown brand"),
        el("p", {}, `Design score ${ad.rank_score == null ? "–" : ad.rank_score.toFixed(2)}` +
          (ad.creative_variant_count ? ` · ${ad.creative_variant_count} near-copies hidden` : "")),
        el("p", {}, `First seen ${shortDate(ad.first_seen_at)} · last seen ${shortDate(ad.last_seen_at)} · found in ${ad.times_seen} search${ad.times_seen === 1 ? "" : "es"}`),
        ...lines.map(t => el("p", {}, t)),
        d.ad_id ? el("p", {}, el("a", {href: `https://www.facebook.com/ads/library/?id=${encodeURIComponent(d.ad_id)}`,
          target: "_blank", rel: "noreferrer"}, "Open in Meta Ad Library ↗")) : null)));
  dialog.showModal();
}

async function getJSON(url, headers = {}) {
  const res = await fetch(url, {headers});
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function categoryKey(category) {
  return category.trim().split(/\s+/).join(" ").toLowerCase();
}

async function loadCategories() {
  if (!SUPABASE) {
    return (await getJSON("library/categories?design_led_only=" + state.designLed)).categories;
  }
  const rows = await getJSON(`${SUPABASE.supabaseUrl}/rest/v1/ad_categories?select=*`, {apikey: SUPABASE.publishableKey});
  return rows.map(r => ({category: r.category, country: r.country,
    active: state.designLed ? r.active_design_led : r.active,
    archived: state.designLed ? r.archived_design_led : r.archived}));
}

async function loadAds() {
  if (!SUPABASE) {
    const q = new URLSearchParams({archived: state.archived, design_led_only: state.designLed});
    if (state.category) q.set("category", state.category);
    if (state.country) q.set("country", state.country);
    return (await getJSON("library?" + q)).ads;
  }
  const cutoff = new Date(Date.now() - ARCHIVE_DAYS * 864e5).toISOString();
  const q = new URLSearchParams({
    select: "id,category,country,brand,image_url,thumbnail_key,rank_score,creative_variant_count,details,first_seen_at,last_seen_at,times_seen",
    last_seen_at: (state.archived ? "lt." : "gte.") + cutoff,
    order: "rank_score.desc.nullslast,id.asc", limit: "1000"});
  if (state.designLed) q.set("rank_score", "gte." + DESIGN_LED_MIN);
  if (state.category) q.set("category_key", "eq." + categoryKey(state.category));
  if (state.country) q.set("country", "eq." + state.country);
  const rows = await getJSON(`${SUPABASE.supabaseUrl}/rest/v1/ads?${q}`, {apikey: SUPABASE.publishableKey});
  for (const r of rows) {
    r.thumbnail_url = r.thumbnail_key
      ? `${SUPABASE.supabaseUrl}/storage/v1/object/public/thumbnails/${encodeURIComponent(r.thumbnail_key)}` : null;
  }
  return rows;
}

async function refresh() {
  writeHash();
  document.getElementById("tab-active").setAttribute("aria-pressed", String(!state.archived));
  document.getElementById("tab-archive").setAttribute("aria-pressed", String(state.archived));
  document.getElementById("design-led").checked = state.designLed;
  try {
    const [categories, ads] = await Promise.all([loadCategories(), loadAds()]);
    state.categories = categories;
    renderCategories();
    renderAds(ads);
  } catch (err) {
    document.getElementById("grid").replaceChildren(el("div", {class: "empty"}, `Couldn't load the library (${err.message}). Try refreshing.`));
  }
}

document.getElementById("tab-active").onclick = () => { state.archived = false; refresh(); };
document.getElementById("tab-archive").onclick = () => { state.archived = true; refresh(); };
document.getElementById("design-led").onchange = e => { state.designLed = e.target.checked; refresh(); };
document.getElementById("dialog").addEventListener("click", e => { if (e.target.id === "dialog") e.target.close(); });
window.addEventListener("hashchange", () => { readHash(); refresh(); });  // pasted links, Back button
readHash();
refresh();
</script>
</body>
</html>
